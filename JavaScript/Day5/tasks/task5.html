<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Day5 - Task5</title>

    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }

        ul, li {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;

            div {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
                gap: 0.5rem;
                padding: 0.5rem;
            }

            div > input {
                width: 300px;
                padding: 0.5em;
                border: 1px solid lightgray;
                outline: none;
                border-radius: 0.3em;
            }
        }

        ul li {
            padding: 0.2em;

            &:hover {
                background: lightgray;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div>
            <input type="text" placeholder="Search user" id="name">
        </div>

        <div>
            <h4>Users</h4>
            <ul class="list">
            <!-- <li></li> -->
        </ul>
        </div>
    </div>

    <script>
        const list = document.querySelector(".list");
        const input_filde = document.querySelector("#name");
        let users = null;
        let index = null;

        ; (async () => {
            try {
                const res = await fetch("https://jsonplaceholder.typicode.com/users");
                users = await res.json();
                renderUsers(users)
            } catch (err) {
                console.log("Error: ", err);
            }
        })();

        input_filde.addEventListener("input", (e) => {
            clearTimeout(index);
            index = setTimeout(()  => {
                console.log(index);
                filterUsersByName(e.target.value);
            }, 1000)
        })

        function filterUsersByName(name) {
            list.innerHTML = "";
            if(name !== "") {
                const filtered_users = users.filter(user => user.name.toLowerCase().includes(name.toLowerCase()));
                renderUsers(filtered_users);
            } else {
                renderUsers(users);
            }
        }

        function renderUsers(users) {
            users.forEach((user) => {
                const li = document.createElement("li");
                li.innerText = user.name;
                list.appendChild(li);
            })
        }
    </script>
</body>

</html>
