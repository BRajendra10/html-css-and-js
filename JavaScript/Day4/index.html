<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript - Day-4</title>

    <style>
        * {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }

        body {
            background: whitesmoke;
        }

        form {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: white;
            box-shadow: 2px 2px 5px lightgray;
            border: 1px solid lightgray;
            padding: 1.5rem;
            border-radius: 1rem;

            h1 {
                font-size: 2em;
                text-align: center;
            }

            div {
                display: flex;
                flex-direction: column;
                gap: 0.3em;

                label {
                    font-size: 1em;
                    font-weight: normal;
                }

                input {
                    padding: 0.8em;
                    border: 1px solid gray;
                    border-radius: 0.5em;

                    &::placeholder {
                        color: gray;
                        font-size: 1em;
                    }
                }

                span.error {
                    display: none;
                    color: red;
                    font-size: 1em;

                    &::before {
                        content: "*";
                    }
                }
            }

            button {
                padding: 0.8em;
                margin-top: 1em;
                border: none;
                border-radius: 0.5em;
                background-color: rebeccapurple;
                color: white;
                cursor: pointer;
                font-size: 1em;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>
    

    <form>
        <h1>Login</h1>

        <div>
            <label for="email">Email</label>
            <input type="email" placeholder="Enter your email" name="email" id="email">
            <span class="error" id="email-error">email is required</span>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Min 8 Digit password" name="password" id="password">
            <span class="error" id="password-error">
                password is required
            </span>
        </div>

        <button type="submit" id="login-btn">Login</button>
    </form>

    <script src="domAndEvents.js"></script>
</body>
</html>
